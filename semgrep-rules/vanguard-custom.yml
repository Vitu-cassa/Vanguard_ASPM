# Regras custom Vanguard (13) — complementam os rulesets p/javascript e p/nodejs.
# Testadas contra targets/mini-app: cada regra dispara no ponto semeado, sem
# falso positivo nem duplicata (ver README, seção 3.1).
# Focadas nos padrões LGPD comuns que a Semgrep OSS não pega por default.
rules:

  - id: vanguard.md5-used-for-password
    message: >-
      MD5 é usado para hash de senha. Algoritmo fraco, quebrável em minutos
      com hardware moderno. Substitua por bcrypt/argon2.
    severity: ERROR
    languages: [javascript]
    pattern: crypto.createHash("md5")
    metadata:
      cwe: CWE-327
      category: security
      owasp: A02:2021 - Cryptographic Failures

  - id: vanguard.sql-string-concat
    message: >-
      Query SQL montada por concatenação de string com input do usuário.
      Vulnerável a SQL Injection. Use parâmetros vinculados.
    severity: ERROR
    languages: [javascript]
    # Só dispara quando o literal à esquerda do "+" começa com um comando SQL.
    # A versão anterior usava `pattern-inside: $DB.$METHOD(...)`, que casava
    # com QUALQUER concatenação dentro de router.get(...) — gerava falso
    # positivo em admin.js (exec) e profile.js (HTML) e achado duplicado.
    patterns:
      - pattern: '"$SQL" + $X'
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i)^\s*(select|insert|update|delete|replace|merge|with)\s
    metadata:
      cwe: CWE-89
      category: security
      owasp: A03:2021 - Injection

  - id: vanguard.password-in-log
    message: >-
      Campo password (ou similar) escrito em log/console. Exposição de dado
      pessoal sensível em runtime — violação direta da LGPD Art. 46.
    severity: WARNING
    languages: [javascript]
    pattern-either:
      - pattern: 'console.log(..., { ..., password: $X, ... }, ...)'
      - pattern: 'console.log(..., $X, ..., password, ...)'
      - pattern: 'console.log(..., "password", ..., $X)'
    metadata:
      cwe: CWE-532
      category: security
      owasp: A09:2021 - Security Logging and Monitoring Failures

  - id: vanguard.sha1-in-security-context
    message: >-
      SHA1 usado em contexto de segurança (fingerprint/assinatura). Considerado
      quebrado desde 2017. Use SHA-256 ou superior.
    severity: WARNING
    languages: [javascript]
    pattern: crypto.createHash("sha1")
    metadata:
      cwe: CWE-328
      category: security

  - id: vanguard.math-random-for-token
    message: >-
      Math.random() não é criptograficamente seguro. Se usado para gerar IDs
      de sessão, tokens ou nonces, permite predição.
    severity: WARNING
    languages: [javascript]
    pattern: Math.random()
    metadata:
      cwe: CWE-338
      category: security

  - id: vanguard.child-process-exec-userinput
    message: >-
      child_process.exec com input do usuário. Vulnerável a command injection —
      um payload como "; rm -rf /" executa comandos arbitrários no servidor.
    severity: ERROR
    languages: [javascript]
    pattern: child_process.exec($X + $Y, ...)
    metadata:
      cwe: CWE-78
      category: security
      owasp: A03:2021 - Injection

  - id: vanguard.eval-userinput
    message: >-
      eval() executa código arbitrário. Se receber input do usuário, é
      remote code execution direto.
    severity: ERROR
    languages: [javascript]
    pattern: eval($X)
    metadata:
      cwe: CWE-95
      category: security
      owasp: A03:2021 - Injection

  - id: vanguard.new-function-userinput
    message: >-
      new Function() é equivalente a eval — compila código arbitrário em runtime.
      Nunca use com input do usuário.
    severity: ERROR
    languages: [javascript]
    pattern: new Function(...)
    metadata:
      cwe: CWE-94
      category: security

  - id: vanguard.xss-html-concat
    message: >-
      HTML montado com concatenação de string incluindo input do usuário.
      Vulnerável a XSS refletido.
    severity: WARNING
    languages: [javascript]
    # O padrão antigo ('"<...>" + $X') não é sintaxe válida de Semgrep para
    # "string contendo tag" e nunca disparava. Aqui o literal é capturado em
    # $HTML e filtrado por regex.
    patterns:
      - pattern: '"$HTML" + $X'
      - metavariable-regex:
          metavariable: $HTML
          regex: <[a-zA-Z!/]
    metadata:
      cwe: CWE-79
      category: security
      owasp: A03:2021 - Injection

  - id: vanguard.open-redirect
    message: >-
      res.redirect() recebe valor não validado vindo da requisição. Permite
      redirecionamento para site malicioso (open redirect).
    severity: WARNING
    languages: [javascript]
    # Modo taint: segue o valor de req.query/params/body até o redirect,
    # mesmo passando por variável intermediária (const to = req.query.to).
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.params
      - pattern: req.body
    pattern-sinks:
      - pattern: res.redirect(...)
    metadata:
      cwe: CWE-601
      category: security

  - id: vanguard.path-traversal
    message: >-
      Caminho de arquivo montado com valor vindo da requisição, sem validar
      "../". Permite ler arquivos fora da pasta esperada (path traversal).
      Use path.basename() ou resolva o caminho e confira o prefixo.
    severity: ERROR
    languages: [javascript]
    mode: taint
    pattern-sources:
      - pattern: req.query
      - pattern: req.params
      - pattern: req.body
    # Sinks só onde o caminho é MONTADO/servido. Incluir fs.readFile também
    # faria o mesmo bug aparecer 2x (join na linha N e readFile na N+1).
    pattern-sinks:
      - pattern: path.join(...)
      - pattern: path.resolve(...)
      - pattern: res.sendFile(...)
      - pattern: res.download(...)
    pattern-sanitizers:
      - pattern: path.basename(...)
    metadata:
      cwe: CWE-22
      category: security
      owasp: A01:2021 - Broken Access Control

  - id: vanguard.hardcoded-secret
    message: >-
      Token/segredo estático definido como constante no código-fonte.
      Mova para variável de ambiente ou cofre de segredos e rotacione o valor.
    severity: ERROR
    languages: [javascript]
    # Regex em uma linha só: com o bloco "|" do YAML a regex terminava com
    # "\n" e nunca casava (a linha real termina em ";").
    pattern-regex: (?i)\b(?:const|let|var)\s+\w*(?:token|secret|api_?key|passw(?:or)?d)\w*\s*=\s*["'][^"'\s]{8,}["']
    metadata:
      cwe: CWE-798
      category: security

  - id: vanguard.hardcoded-api-key-in-yaml
    message: >-
      Chave de API/secret hardcoded em arquivo de configuração versionado.
      Rotacione a chave e mova para variável de ambiente.
    severity: ERROR
    languages: [yaml]
    pattern-regex: (?i)(api_?key|api_?token|secret)\w*\s*:\s*["']?(sk_live_|whsec_|xoxp-|ghp_)[A-Za-z0-9_\-]+
    metadata:
      cwe: CWE-798
      category: security
      owasp: A07:2021 - Identification and Authentication Failures
