<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Vanguard ASPM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0A0A0F; color:#FFFFFF; font-family:Inter,system-ui,sans-serif; }
    .surface { background:#14141F; border:1px solid #2A2A3A; }
    .surface-2 { background:#1A1A28; border:1px solid #2A2A3A; }
    .muted { color:#9CA3AF; }
    .mono { font-family:"JetBrains Mono",ui-monospace,monospace; }
    .danger { color:#FF5A5F; }
    .warn { color:#F0B90B; }
    .badge { display:inline-block; padding:2px 8px; border-radius:9999px; font-size:11px; letter-spacing:.02em; }
    .badge-high { background:rgba(255,90,95,.15); color:#FF5A5F; border:1px solid rgba(255,90,95,.4); }
    .badge-med  { background:rgba(240,185,11,.12); color:#F0B90B; border:1px solid rgba(240,185,11,.4); }
    .badge-low  { background:rgba(156,163,175,.12); color:#9CA3AF; border:1px solid rgba(156,163,175,.4); }
    .badge-lgpd { background:rgba(240,185,11,.12); color:#F0B90B; border:1px solid rgba(240,185,11,.4); }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-[#2A2A3A]">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-4">
      <div class="text-2xl font-bold tracking-tight">VANGUARD</div>
      <div class="muted text-xs">ASPM MVP · FIAP 2026 · Pride Security</div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <section id="stats" class="grid grid-cols-2 md:grid-cols-5 gap-4"></section>

    <section class="mt-8 flex gap-2 items-center">
      <label class="muted text-sm">Filtrar:</label>
      <select id="fSev" class="surface px-3 py-2 rounded text-sm">
        <option value="">Todas as severidades</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="LOW">LOW</option>
      </select>
      <label class="flex items-center gap-1 muted text-sm ml-2">
        <input type="checkbox" id="fLgpd"> apenas LGPD
      </label>
    </section>

    <section class="mt-4 surface rounded-lg overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-[#1A1A28] muted">
          <tr>
            <th class="text-left px-4 py-3">#</th>
            <th class="text-left px-4 py-3">Sev</th>
            <th class="text-left px-4 py-3">LGPD</th>
            <th class="text-left px-4 py-3">Regra</th>
            <th class="text-left px-4 py-3">Local</th>
            <th class="text-left px-4 py-3">CWE</th>
            <th class="text-left px-4 py-3">Triagem IA</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <section id="detail" class="mt-8 hidden surface-2 rounded-lg p-6"></section>
  </main>

<script>
const $ = (s) => document.querySelector(s);

async function loadStats() {
  const s = await fetch("/api/stats").then(r => r.json());
  const bs = s.by_severity;
  $("#stats").innerHTML = `
    <div class="surface rounded-lg p-4">
      <div class="muted text-xs uppercase tracking-widest">Total</div>
      <div class="text-3xl font-semibold mt-2">${s.total}</div>
    </div>
    <div class="surface rounded-lg p-4">
      <div class="muted text-xs uppercase tracking-widest">HIGH</div>
      <div class="text-3xl font-semibold mt-2 danger">${bs.HIGH || 0}</div>
    </div>
    <div class="surface rounded-lg p-4">
      <div class="muted text-xs uppercase tracking-widest">MEDIUM</div>
      <div class="text-3xl font-semibold mt-2 warn">${bs.MEDIUM || 0}</div>
    </div>
    <div class="surface rounded-lg p-4">
      <div class="muted text-xs uppercase tracking-widest">Flag LGPD</div>
      <div class="text-3xl font-semibold mt-2 warn">${s.lgpd}</div>
    </div>
    <div class="surface rounded-lg p-4">
      <div class="muted text-xs uppercase tracking-widest">Score</div>
      <div class="text-3xl font-semibold mt-2">${s.security_score}</div>
      <div class="muted text-xs mt-1">${s.security_score_label} · ${s.pct_triado}% triado</div>
    </div>
  `;
}

function badgeSev(v){
  if (v==='HIGH') return `<span class="badge badge-high">HIGH</span>`;
  if (v==='MEDIUM') return `<span class="badge badge-med">MEDIUM</span>`;
  return `<span class="badge badge-low">${v||'?'}</span>`;
}

async function loadRows() {
  const sev = $("#fSev").value;
  const lgpd = $("#fLgpd").checked ? "1" : "";
  const url = new URL("/api/findings", location.origin);
  if (sev) url.searchParams.set("severity", sev);
  if (lgpd) url.searchParams.set("lgpd", "true");
  const rows = await fetch(url).then(r => r.json());
  $("#rows").innerHTML = rows.map(r => `
    <tr class="border-t border-[#2A2A3A] cursor-pointer hover:bg-[#1A1A28]" data-id="${r.id}">
      <td class="px-4 py-3 mono muted">${r.id}</td>
      <td class="px-4 py-3">${badgeSev(r.severity)}</td>
      <td class="px-4 py-3">${r.lgpd_flag ? '<span class="badge badge-lgpd">LGPD</span>' : ''}</td>
      <td class="px-4 py-3 mono truncate max-w-[280px]" title="${r.rule_id}">${r.rule_id.split('.').slice(-1)[0]}</td>
      <td class="px-4 py-3 mono">${r.file_path}:${r.line}</td>
      <td class="px-4 py-3 mono muted">${r.cwe||''}</td>
      <td class="px-4 py-3 muted">${r.ai_triage||'—'}</td>
    </tr>
  `).join("");
  document.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => showDetail(tr.dataset.id));
  });
}

async function showDetail(id) {
  const d = await fetch(`/api/findings/${id}`).then(r => r.json());
  const box = $("#detail");
  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      ${badgeSev(d.severity)}
      ${d.lgpd_flag ? '<span class="badge badge-lgpd">LGPD</span>' : ''}
      <span class="muted text-sm">priority ${d.priority_score}</span>
      <span class="muted text-sm">· triagem: <b>${d.ai_triage||'pendente'}</b></span>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div>
        <div class="muted text-xs uppercase tracking-widest">Regra</div>
        <div class="mono text-sm break-all">${d.rule_id}</div>
        <div class="muted text-xs uppercase tracking-widest mt-4">Local</div>
        <div class="mono text-sm">${d.file_path}:${d.line}</div>
        <div class="muted text-xs uppercase tracking-widest mt-4">CWE</div>
        <div class="mono text-sm">${d.cwe||'—'}</div>
        <div class="muted text-xs uppercase tracking-widest mt-4">Mensagem do scanner</div>
        <div class="text-sm">${d.message}</div>
      </div>
      <div>
        <div class="muted text-xs uppercase tracking-widest">Explicação (IA)</div>
        <div class="text-sm mt-1">${d.ai_explanation||'—'}</div>
        <div class="muted text-xs uppercase tracking-widest mt-4">Sugestão de correção (IA)</div>
        <div class="text-sm mt-1">${d.ai_fix||'—'}</div>
      </div>
    </div>
  `;
  box.scrollIntoView({behavior:'smooth', block:'start'});
}

$("#fSev").addEventListener('change', loadRows);
$("#fLgpd").addEventListener('change', loadRows);
loadStats(); loadRows();
</script>
</body>
</html>
